<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Familia ECO">
  <title>Familia ECO</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">

  <style>
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f4f4;color:#26352c}
    body{display:grid;place-items:center;min-height:100vh}
    .wrap{width:min(88vw,430px);text-align:center;padding:30px 22px}
    .icon{width:168px;height:168px;border-radius:38px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:block;margin:0 auto 22px}
    h1{font-size:32px;margin:0 0 10px}
    p{font-size:17px;line-height:1.45;color:#58645d;margin:0 0 22px}
    .button{display:block;background:#2e7d32;color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:16px 20px;border-radius:14px}
    .hint{font-size:14px;margin-top:18px;color:#768079}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="icon" src="./assets/icon-192.png" alt="Familia ECO">
    <h1>Familia ECO</h1>
    <p>Actividades y experiencias para compartir en familia.</p>
    <a class="button" href="https://script.google.com/macros/s/AKfycbz15pUaMnYUXDkQWlUdRAYq5_qhU2fiRK4Qxy60Ta62049109RvFbJxqXMe-O6NuWsTUg/exec">Abrir Familia ECO</a>
    <div class="hint">Puedes agregar esta página a tu pantalla de inicio o al Dock.</div>
  </main>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

    // Si ya fue instalada como app, entra directamente a Familia ECO.
    const instalada =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (instalada) {
      window.location.replace('https://script.google.com/macros/s/AKfycbz15pUaMnYUXDkQWlUdRAYq5_qhU2fiRK4Qxy60Ta62049109RvFbJxqXMe-O6NuWsTUg/exec');
    }
  </script>
</body>
</html>
