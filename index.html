<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Familia ECO">
  <title>Familia ECO</title>
  <link rel="manifest" href="./manifest.json?v=6">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=6">

  <style>
    :root{--green:#2e7d32;--bg:#f4f4f4;--text:#172126;--muted:#687277;--line:#e2e5e7}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{min-height:100vh}
    .logoHeader{background:#000;padding:16px 20px 13px;text-align:center}
    .officialLogo{display:block;width:min(92vw,560px);max-height:145px;object-fit:contain;margin:0 auto}
    .hero{background:var(--green);color:#fff;padding:22px 20px}
    .heroInner,.feed{width:min(100%,720px);margin:0 auto}
    .eyebrow{font-size:15px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
    h1{font-size:38px;line-height:1.05;margin:5px 0 8px;font-weight:950}
    .subtitle{font-size:18px;line-height:1.4;margin:0;opacity:.96}
    .feed{padding:22px 14px 44px}
    .status{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;font-size:18px;line-height:1.45;text-align:center}
    .card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:0 0 22px;box-shadow:0 5px 18px rgba(0,0,0,.07)}
    .cover{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#e9ecee}
    .body{padding:21px}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .pill{display:inline-flex;align-items:center;min-height:32px;padding:6px 10px;border-radius:999px;background:#f1f2f3;color:#4f5a5f;font-size:14px;font-weight:850}
    .title{font-size:28px;line-height:1.16;font-weight:950;margin:0 0 12px}
    .desc{font-size:18px;line-height:1.5;color:#4d575c;white-space:pre-line;margin:0}
    .date{font-size:16px;line-height:1.4;color:#687277;font-weight:800;margin-top:15px}
    .action{display:block;width:100%;margin-top:19px;padding:16px 18px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;text-align:center;font-size:18px;font-weight:950}
    .footer{text-align:center;color:#7a8387;font-size:14px;line-height:1.4;padding:2px 20px 32px}
    @media(min-width:760px){.feed{padding-left:0;padding-right:0}.hero{padding:28px 20px}h1{font-size:44px}}
  </style>
</head>

  <header class="hero">
    <div class="heroInner">
      <div class="eyebrow">Embotelladora de Colima</div>
      <h1>Familia ECO</h1>
      <p class="subtitle">Actividades y experiencias para compartir en familia.</p>

  <main id="feed" class="feed"><div class="status">Cargando actividades familiares…</div></main>
  <div class="footer">Familia ECO · Embotelladora de Colima</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function urlSegura_(u){
  const s=String(u||'').trim();
  return /^https?:\/\//i.test(s)?s:'';
}
function render_(r){
  const feed=document.getElementById('feed');
  const items=(r&&r.ok&&Array.isArray(r.actividades))?r.actividades:[];
  if(!items.length){
    feed.innerHTML='<div class="status">Por el momento no hay actividades familiares vigentes.</div>';
    return;
  }
  feed.innerHTML=items.map(a=>{
    const u=urlSegura_(a.url);
    return `<article class="card">
      ${a.imagen?`<img class="cover" src="${a.imagen}" alt="">`:''}
      <div class="body">
        <h2 class="title">${esc(a.titulo||'Actividad familiar')}</h2>
        ${a.fechaFin?`<div class="date">Disponible hasta ${esc(a.fechaFin)}</div>`:''}
        ${u?`<a class="action" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Ingresar / inscribirme</a>`:''}
      </div>
    </article>`;
  }).join('');
}
function error_(e){
  document.getElementById('feed').innerHTML='<div class="status">No fue posible cargar las actividades en este momento.</div>';
}
const API_URL='https://script.google.com/macros/s/AKfycbz15pUaMnYUXDkQWlUdRAYq5_qhU2fiRK4Qxy60Ta62049109RvFbJxqXMe-O6NuWsTUg/exec';
function cargarActividades_(){
  const callback='familiaEcoCallback_'+Date.now();
  const script=document.createElement('script');
  let terminado=false;
  let timer=null;
  const limpiar=()=>{
    if(terminado)return;
    terminado=true;
    if(timer) clearTimeout(timer);
    try{delete window[callback]}catch(_){window[callback]=undefined}
    script.remove();
  };
  window[callback]=r=>{limpiar();render_(r)};
  script.onerror=()=>{limpiar();error_()};
  script.src=API_URL+'?api=actividades&callback='+encodeURIComponent(callback)+'&_='+Date.now();
  document.head.appendChild(script);
  timer=setTimeout(()=>{limpiar();error_()},15000);
}
cargarActividades_();
</script>
