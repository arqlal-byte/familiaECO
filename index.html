<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familia ECO">
<title>Familia ECO</title>
<link rel="manifest" href="./manifest.json?v=3">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=3">
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#install{height:100%;display:grid;place-items:center;color:#203026}
.card{width:min(86vw,420px);text-align:center}
.logo{width:170px;height:170px;border-radius:38px;display:block;margin:0 auto 22px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
h1{margin:0 0 8px;font-size:31px} p{margin:0;color:#667069;font-size:16px;line-height:1.4}
#appframe{display:none;border:0;width:100%;height:100%;background:#fff}
</style>
</head>
<body>
<section id="install">
 <div class="card">
   <img class="logo" src="./assets/icon-192.png?v=3" alt="Familia ECO">
   <h1>Familia ECO</h1>
   <p>Agrega esta página al Dock o a la pantalla de inicio.</p>
 </div>
</section>
<iframe id="appframe" title="Familia ECO" allow="clipboard-read; clipboard-write"></iframe>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=3').catch(()=>{});

const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;

if (standalone) {
  document.getElementById('install').style.display='none';
  const f=document.getElementById('appframe');
  f.style.display='block';
  f.src='https://script.google.com/macros/s/AKfycbz15pUaMnYUXDkQWlUdRAYq5_qhU2fiRK4Qxy60Ta62049109RvFbJxqXMe-O6NuWsTUg/exec';
}
</script>
</body>
</html>
